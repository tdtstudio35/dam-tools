    </footer>
    <script>
        function ipToInt(ip) {
            return ip.split('.').reduce((acc, oct) => (acc << 8) + parseInt(oct, 10), 0) >>> 0;
        }
        function intToIp(n) {
            return [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join('.');
        }
        function calcular() {
            const ip = document.getElementById('ip').value.trim();
            const cidr = parseInt(document.getElementById('cidr').value, 10);
            const out = document.getElementById('resultado');
            if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip) || isNaN(cidr) || cidr < 0 || cidr > 32) {
                out.innerHTML = '<p class="text-rose-400">IP o CIDR inválido.</p>';
                return;
            }
            const ipInt = ipToInt(ip);
            const mask = cidr === 0 ? 0 : (0xFFFFFFFF << (32 - cidr)) >>> 0;
            const network = (ipInt & mask) >>> 0;
            const broadcast = (network | (~mask >>> 0)) >>> 0;
            const firstHost = cidr >= 31 ? network : network + 1;
            const lastHost = cidr >= 31 ? broadcast : broadcast - 1;
            const hosts = cidr >= 31 ? (cidr === 32 ? 1 : 2) : Math.pow(2, 32 - cidr) - 2;
            const wildcard = (~mask) >>> 0;
            const rows = [
                ['Dirección de red', intToIp(network) + '/' + cidr],
                ['Máscara de subred', intToIp(mask)],
                ['Wildcard', intToIp(wildcard)],
                ['Broadcast', intToIp(broadcast)],
                ['Primer host', intToIp(firstHost)],
                ['Último host', intToIp(lastHost)],
                ['Hosts utilizables', hosts.toLocaleString()],
            ];
            out.innerHTML = rows.map(([k, v]) => `<div class="flex justify-between gap-4 border-b border-zinc-800/60 py-1.5"><span class="text-zinc-400">${k}</span><span class="text-emerald-400">${v}</span></div>`).join('');
        }
        calcular();
    </script>
