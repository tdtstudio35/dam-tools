<!DOCTYPE html>
<html lang="es" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDT Studio — Workspace para DAM y DAW</title>
    <meta name="description" content="Herramientas interactivas, generadores de código y diccionario de snippets para estudiantes de DAM y DAW.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #09090b !important;
            color: #e4e4e7 !important;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .bg-grid-pattern {
            background-image: radial-gradient(#27272a 1px, transparent 1px);
            background-size: 24px 24px;
            -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 20%, #000 60%, transparent 100%);
            mask-image: radial-gradient(ellipse 80% 70% at 50% 20%, #000 60%, transparent 100%);
        }
        code, pre, .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .fade-in {
            animation: fadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        pre::-webkit-scrollbar {
            height: 6px;
        }
        pre::-webkit-scrollbar-track {
            background: #09090b;
            border-radius: 4px;
        }
        pre::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }
        pre::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
</head>
